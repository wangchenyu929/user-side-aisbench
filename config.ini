; Edit this file, then run ./run.sh in this directory.
; Empty values are not passed to the script. true/false is case-insensitive.

[paths]
; Relative to the directory that contains config.ini. Use . when run.sh lives here.
bench_dir = .
python = python3

[run]
; auto-probe = search for the highest concurrency that still meets TTFT/TPOT limits
; matrix     = run the fixed concurrency table hardcoded in the script
mode = auto-probe

[server]
url = http://HOST/v1
model = your-model-name

[prompt]
; synthetic = "A A A..." ; gsm8k = pad GSM8K words to the target length
source = synthetic
; When source=synthetic, true rewrites each request as U0/U1/... so prefix cache cannot hit.
unique = false
; GSM8K JSON path. Empty uses data/gsm8k.json.
dataset =

[slo]
; Latency bounds used by auto-probe. A concurrency fails when either limit is exceeded.
ttft_max_ms = 5000
tpot_max_ms = 100
; mean / p50 / p90 / p99
stat = mean
ttft_metric = TTFT_sse

[probe]
; Input length / output length, comma-separated. Used by auto-probe.
; workloads = 32772/512,65540/1024
workloads = 32772/512
coarse_step = 20
; Concurrency list to try. Empty starts at 1, then coarse_step, 2*coarse_step, ... until TTFT or TPOT misses the SLO.
coarse_concurrencies =
warmup = 0
cooldown = 10
n_multiplier = 2
; Fixed-matrix subset, used with CASES in bench_xlsx_matrix.py. Examples: 1,13 or 1-5.
; Only applies when mode=matrix. Empty runs every test.
test_ids =

[output]
; Relative to the directory that contains config.ini.
; The workbook stores the url and model from this run. Do not commit results/.
out = results/bench.xlsx
